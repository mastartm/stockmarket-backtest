name: Veriyi güncelle

on:
  schedule:
    - cron: "30 22 * * 1-5" # hafta içi her gün, ABD piyasası kapandıktan sonra
  workflow_dispatch: # elle çalıştırma butonu

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build_data.py
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/results.json
          git diff --staged --quiet || git commit -m "Veri güncellendi"
          git push
